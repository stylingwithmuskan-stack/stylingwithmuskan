# Nginx configuration for serving images directly from VPS storage
# Include this block in your server {} block (e.g., inside /etc/nginx/sites-available/api.domain.com)

location /images/ {
    # Path to where images are stored on the VPS
    alias /var/storage/;
    
    # Enable CORS if images are requested from different subdomains/domains
    add_header Access-Control-Allow-Origin "*";
    add_header Access-Control-Allow-Methods "GET, OPTIONS";
    add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization";

    # Handle preflight requests
    if ($request_method = OPTIONS) {
        return 204;
    }

    # Browser caching rules (Cache images for 30 days)
    expires 30d;
    add_header Cache-Control "public, no-transform";
    
    # Security headers
    add_header X-Content-Type-Options nosniff;
    
    # Restrict allowed HTTP methods (only GET for images)
    limit_except GET OPTIONS {
        deny all;
    }

    # Disable directory listing
    autoindex off;

    # Optional: Log requests to images (or turn off to save disk space)
    # access_log off;
    
    # Try to serve the exact file, if not found return 404
    try_files $uri $uri/ =404;
}
